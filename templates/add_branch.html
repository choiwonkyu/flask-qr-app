<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>지점 추가 및 목록</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            color: #333;
        }

        form {
            background: #fff;
            padding: 20px 30px;
            margin-bottom: 40px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 10px;
            width: 500px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #0e7de4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            max-width: 1200px;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            word-break: break-word;
        }

        th {
            background-color: #e8f0fe;
        }

        /* ✅ 칼럼별 너비 조정 */
        th:nth-child(1), td:nth-child(1) { min-width: 200px; } /* 지점명 */
        th:nth-child(2), td:nth-child(2) { min-width: 130px; } /* 전화번호 */
        th:nth-child(3), td:nth-child(3) { min-width: 250px; max-width: 350px; } /* 채팅 주소 */
        th:nth-child(4), td:nth-child(4) { min-width: 100px; } /* 접속 코드 */
        th:nth-child(5), td:nth-child(5) { min-width: 120px; } /* QR 코드 */
        th:nth-child(6), td:nth-child(6) { min-width: 60px; }  /* 관리 최소화 */

        img.qr {
            width: 100px;
            height: 100px;
        }

        .actions button,
        .actions a {
            margin: 5px 0;
            display: inline-block;
        }

        .download-link {
            display: inline-block;
            margin-top: 5px;
            font-size: 12px;
        }

        a {
            color: #0e7de4;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h2>🏢 지점 추가</h2>
    <form method="POST">
        <label for="name">지점명:</label>
        <input type="text" name="name" required>

        <label for="phone">전화번호:</label>
        <input type="text" name="phone" required>

        <label for="chat_url">채팅 URL:</label>
        <input type="url" name="chat_url" required>

        <label for="slug">접속 코드 (예: abc123):</label>
        <input type="text" name="slug" required>

        <button type="submit">➕ 지점 추가</button>
    </form>

    <h2>📋 지점 목록</h2>
    <table>
        <thead>
            <tr>
                <th>지점명</th>
                <th>전화번호</th>
                <th>채팅 주소</th>
                <th>접속 코드</th>
                <th>QR 코드</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody>
            {% for branch in branches %}
            <tr>
                <!-- 지점명 -->
                <td><a href="{{ url_for('branch_page', slug=branch[3]) }}" target="_blank">{{ branch[0] }}</a></td>

                <!-- 전화번호 -->
                <td>{{ branch[1] }}</td>

                <!-- 채팅 주소 -->
                <td><a href="{{ branch[2] }}" target="_blank">{{ branch[2] }}</a></td>

                <!-- 접속 코드 -->
                <td>{{ branch[3] }}</td>

                <!-- QR 코드 -->
                <td>
                    {% set qr_url = request.url_root ~ 'b/' ~ branch[3] %}
                    <img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data={{ qr_url | urlencode }}" alt="QR Code">
                    <br>
                    <a class="download-link" href="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data={{ qr_url | urlencode }}" download="QR_{{ branch[3] }}.png">⬇️ 다운로드</a>
                </td>

                <!-- 관리 -->
                <td class="actions">
                    <form method="POST" action="{{ url_for('delete_branch', slug=branch[3]) }}">
                        <button type="submit">🗑️ 삭제</button>
                    </form>
                    <a href="{{ url_for('edit_branch', slug=branch[3]) }}">✏️ 수정</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
