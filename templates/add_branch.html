<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>지점 추가</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        input, button { padding: 8px; margin: 5px 0; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f4f4f4; }
        .form-container { max-width: 400px; margin-bottom: 50px; }
    </style>
</head>
<body>
    <h1>지점 추가</h1>

    <div class="form-container">
        <form method="POST">
            <label>지점명:</label>
            <input type="text" name="name" required>
            <label>전화번호:</label>
            <input type="text" name="phone" required>
            <label>채팅 주소:</label>
            <input type="text" name="chat_url" required>
            <label>접속 코드 (slug):</label>
            <input type="text" name="slug" required>
            <button type="submit">➕ 추가</button>
        </form>
    </div>

    <h2>등록된 지점 목록</h2>
    <table>
        <thead>
            <tr>
                <th>지점명</th>
                <th>전화번호</th>
                <th>채팅 주소</th>
                <th>접속 코드</th>
                <th>수정</th>
                <th>삭제</th>
            </tr>
        </thead>
        <tbody>
            {% for branch in branches %}
            <tr>
                <td>{{ branch[0] }}</td> <!-- name -->
                <td>{{ branch[1] }}</td> <!-- phone -->
                <td><a href="{{ branch[2] }}" target="_blank">{{ branch[2] }}</a></td> <!-- chat_url -->
                <td>{{ branch[3] }}</td> <!-- slug -->
                <td>
                    <a href="{{ url_for('edit_branch', slug=branch[3]) }}">✏️ 수정</a>
                </td>
                <td>
                    <form method="POST" action="{{ url_for('delete_branch', slug=branch[3]) }}" onsubmit="return confirm('정말 삭제하시겠습니까?');">
                        <button type="submit">🗑️ 삭제</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
