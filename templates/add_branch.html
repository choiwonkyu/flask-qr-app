<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>지점 관리</title>
</head>
<body>
    <h1>📍 지점 추가</h1>

    <form method="POST">
        <input type="text" name="name" placeholder="지점명" required>
        <input type="text" name="phone" placeholder="전화번호" required>
        <input type="text" name="chat_url" placeholder="상담 채팅 URL" required>
        <input type="text" name="slug" placeholder="slug (영문)" required>
        <button type="submit">➕ 추가</button>
    </form>

    <h2>📋 지점 목록</h2>
    <table border="1" cellpadding="8">
        <tr>
            <th>지점명</th>
            <th>전화번호</th>
            <th>상담 URL</th>
            <th>slug</th>
            <th>수정</th>
            <th>삭제</th>
        </tr>
        {% for branch in branches %}
        <tr>
            <td>
                <a href="{{ url_for('branch_page', slug=branch['slug']) }}" target="_blank">
                    {{ branch['name'] }}
                </a>
            </td>
            <td>{{ branch['phone'] }}</td>
            <td><a href="{{ branch['chat_url'] }}" target="_blank">열기</a></td>
            <td>{{ branch['slug'] }}</td>
            <td>
                <a href="{{ url_for('edit_branch', slug=branch['slug']) }}">✏️ 수정</a>
            </td>
            <td>
                <form method="POST" action="{{ url_for('delete_branch', slug=branch['slug']) }}">
                    <button type="submit" onclick="return confirm('삭제하시겠습니까?')">🗑️ 삭제</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="{{ url_for('logout') }}">🔒 로그아웃</a>
</body>
</html>
