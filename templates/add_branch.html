<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>지점 추가</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }
        form {
            margin-bottom: 40px;
        }
        input[type="text"] {
            padding: 5px;
            width: 300px;
        }
        table {
            border-collapse: collapse;
            width: 90%;
        }
        th, td {
            border: 1px solid #999;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .btn-delete, .btn-edit {
            margin-right: 5px;
            padding: 4px 8px;
            text-decoration: none;
            background-color: #eee;
            border: 1px solid #aaa;
            border-radius: 3px;
            color: black;
        }
        .btn-delete:hover {
            background-color: #fdd;
        }
        .btn-edit:hover {
            background-color: #def;
        }
    </style>
</head>
<body>
    <h1>지점 추가</h1>
    <form method="post">
        <label>지점 이름: <input type="text" name="name" required></label><br><br>
        <label>전화번호: <input type="text" name="phone" required></label><br><br>
        <label>채팅 URL (예: 네이버톡톡 주소): <input type="text" name="chat_url" required></label><br><br>
        <label>슬러그 (영문지점코드): <input type="text" name="slug" required></label><br><br>
        <button type="submit">지점 추가</button>
    </form>

    <h2>등록된 지점 목록</h2>
    {% if branches %}
    <table>
        <tr>
            <th>이름</th>
            <th>전화번호</th>
            <th>채팅 URL</th>
            <th>슬러그</th>
            <th>관리</th>
        </tr>
        {% for branch in branches %}
        <tr>
            <td>{{ branch[1] }}</td> <!-- name -->
            <td>{{ branch[2] }}</td> <!-- phone -->
            <td><a href="{{ branch[3] }}" target="_blank">바로가기</a></td> <!-- chat_url -->
            <td>{{ branch[4] }}</td> <!-- slug -->
            <td>
                <a href="/admin/edit/{{ branch[0] }}" class="btn-edit">수정</a>
                <a href="/admin/delete/{{ branch[0] }}" class="btn-delete" onclick="return confirm('삭제하시겠습니까?');">삭제</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <p>등록된 지점이 없습니다.</p>
    {% endif %}
</body>
</html>
