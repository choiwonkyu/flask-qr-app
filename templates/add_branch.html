<!DOCTYPE html>
<html>
<head>
    <title>지점 관리</title>
</head>
<body>
    <h1>📌 지점 추가</h1>
    <form method="post">
        <input type="text" name="name" placeholder="지점명" required>
        <input type="text" name="phone" placeholder="전화번호" required>
        <input type="text" name="chat_url" placeholder="채팅 주소" required>
        <input type="text" name="slug" placeholder="접속 코드 (영문, 고유)" required>
        <button type="submit">추가</button>
    </form>

    <h2>📋 지점 목록</h2>
    <table border="1">
        <tr>
            <th>지점명</th>
            <th>전화번호</th>
            <th>채팅 주소</th>
            <th>접속 코드</th>
            <th>관리</th>
        </tr>
        {% for branch in branches %}
        <tr>
            <td>{{ branch[0] }}</td>
            <td>{{ branch[1] }}</td>
            <td>{{ branch[2] }}</td>
            <td>{{ branch[3] }}</td>
            <td>
                <a href="{{ url_for('edit_branch', slug=branch[3]) }}">수정</a>
                <form method="post" action="{{ url_for('delete_branch', slug=branch[3]) }}" style="display:inline;">
                    <button type="submit">삭제</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
