<!DOCTYPE html>
<html>
<head>
    <title>지점 관리</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
        }
        h2 {
            text-align: center;
        }
        form {
            max-width: 500px;
            margin: 0 auto 40px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background-color: #2196F3;
            color: white;
            border: none;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }
        th, td {
            padding: 15px;
            border: 1px solid #ccc;
            text-align: center;
        }
        a.button {
            background-color: #4CAF50;
            padding: 8px 12px;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        form.inline {
            display: inline;
        }
    </style>
</head>
<body>
    <h2>지점 추가</h2>
    <form method="post">
        <input type="text" name="name" placeholder="지점명" required>
        <input type="text" name="phone" placeholder="업무폰 번호" required>
        <input type="password" name="password" placeholder="지점 비밀번호" required>
        <button type="submit">지점 등록</button>
    </form>

    <h2>지점 목록</h2>
    <table>
        <tr>
            <th>지점명</th>
            <th>번호</th>
            <th>관리</th>
        </tr>
        {% for branch in branches %}
        <tr>
            <td><a href="{{ url_for('branch_page', branch_id=branch.id) }}" class="button">{{ branch.name }}</a></td>
            <td>{{ branch.phone }}</td>
            <td>
                <a href="{{ url_for('edit_branch', branch_id=branch.id) }}" class="button">수정</a>
                <form action="{{ url_for('delete_branch', branch_id=branch.id) }}" method="post" class="inline">
                    <button style="background-color: red;">삭제</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
