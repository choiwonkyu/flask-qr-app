<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>지점 추가 및 목록</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            width: 90%;
            margin-top: 40px;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        h2 {
            color: #333;
            text-align: center;
        }

        form {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #0e7de4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background-color: #f0f0f0;
        }

        a {
            color: #0e7de4;
            text-decoration: none;
        }

        img.qr {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-top: 5px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🏨 지점 추가</h2>
    <form method="POST">
        <label for="name">지점 이름:</label>
        <input type="text" name="name" required>

        <label for="phone">전화번호:</label>
        <input type="text" name="phone" required>

        <label for="chat_url">채팅 URL:</label>
        <input type="url" name="chat_url" required>

        <label for="slug">접속 코드 (예: abc123):</label>
        <input type="text" name="slug" required>

        <button type="submit">➕ 지점 추가</button>
    </form>

    <h2>📋 지점 목록</h2>
    <table>
        <thead>
        <tr>
            <th>지점명</th>
            <th>전화번호</th>
            <th>채팅 주소</th>
            <th>접속 코드</th>
            <th>QR 코드</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        {% for branch in branches %}
        <tr>
            <td><a href="{{ url_for('branch_page', slug=branch[4]) }}" target="_blank">{{ branch[1] }}</a></td>
            <td>{{ branch[2] }}</td>
            <td><a href="{{ branch[3] }}" target="_blank">{{ branch[3] }}</a></td>
            <td>{{ branch[4] }}</td>
            <td>
                <img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data={{ request.host_url }}b/{{ branch[4] }}" alt="QR Code">
                <br>
                <a href="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data={{ request.host_url }}b/{{ branch[4] }}" download="QR_{{ branch[4] }}.png">⬇️ 다운로드</a>
            </td>
            <td class="actions">
                <form method="POST" action="{{ url_for('delete_branch', slug=branch[4]) }}">
                    <button type="submit">🗑️ 삭제</button>
                </form>
                <a href="{{ url_for('edit_branch', slug=branch[4]) }}">✏️ 수정</a>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
