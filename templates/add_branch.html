""
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>지점 관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        th, td {
            vertical-align: middle !important;
            text-align: center;
            word-break: keep-all;
        }
        th {
            white-space: nowrap;
        }
        .qr-image {
            width: 100px;
            height: 100px;
        }
        .qr-download {
            font-size: 0.8rem;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 80px;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="mb-4">지점 관리</h2>

    <form method="POST" action="{{ url_for('add_branch_page') }}" class="row g-2 align-items-end">
        <div class="col-md-3">
            <label class="form-label">지점명</label>
            <input type="text" class="form-control" name="name" required>
        </div>
        <div class="col-md-2">
            <label class="form-label">전화번호</label>
            <input type="text" class="form-control" name="phone" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">채팅 주소</label>
            <input type="url" class="form-control" name="chat_url" required>
        </div>
        <div class="col-md-2">
            <label class="form-label">접속 코드</label>
            <input type="text" class="form-control" name="slug" required>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">추가</button>
        </div>
    </form>

    <hr>

    <div class="table-responsive">
        <table class="table table-bordered align-middle">
            <thead class="table-primary">
            <tr>
                <th>지점명</th>
                <th>전화번호</th>
                <th>채팅 주소</th>
                <th>접속 코드</th>
                <th>QR 코드</th>
                <th style="min-width: 80px;">관리</th>
            </tr>
            </thead>
            <tbody>
            {% for branch in branches %}
                <tr>
                    <td>{{ branch.name }}</td>
                    <td>{{ branch.phone }}</td>
                    <td><a href="{{ branch.chat_url }}" target="_blank">{{ branch.chat_url }}</a></td>
                    <td>{{ branch.slug }}</td>
                    <td>
                        <img src="{{ url_for('generate_qr', slug=branch.slug) }}" alt="QR 코드" class="qr-image mb-1">
                        <br>
                        <a class="qr-download text-primary" href="{{ url_for('generate_qr', slug=branch.slug) }}" download="{{ branch.slug }}.png">📥 다운로드</a>
                    </td>
                    <td class="action-buttons">
                        <form method="POST" action="{{ url_for('delete_branch', branch_id=branch.id) }}">
                            <button type="submit" class="btn btn-danger btn-sm">🗑 삭제</button>
                        </form>
                        <a href="{{ url_for('edit_branch_page', branch_id=branch.id) }}" class="btn btn-outline-primary btn-sm">✏ 수정</a>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
""
