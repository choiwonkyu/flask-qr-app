<style>
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background: #fff;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        border-radius: 10px;
        overflow: hidden;
    }

    th, td {
        padding: 15px;
        text-align: center;
        border-bottom: 1px solid #ddd;
        vertical-align: top;
    }

    th {
        background-color: #e8f0fe;
    }

    img.qr {
        width: 120px;
        height: 120px;
    }

    .download-link {
        display: inline-block;
        margin-top: 5px;
        font-size: 12px;
    }

    .actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        min-width: 70px;
    }

    .actions button,
    .actions a {
        margin: 0;
        padding: 6px 10px;
        font-size: 14px;
        border-radius: 5px;
        text-decoration: none;
    }

    .actions form {
        margin: 0;
    }

    .actions a {
        color: #0e7de4;
    }
</style>

<table>
    <thead>
        <tr>
            <th>지점명</th>
            <th>전화번호</th>
            <th>채팅 주소</th>
            <th>접속 코드</th>
            <th>QR 코드</th>
            <th>관리</th>
        </tr>
    </thead>
    <tbody>
        {% for branch in branches %}
        <tr>
            <!-- 지점명 -->
            <td><a href="{{ url_for('branch_page', slug=branch[3]) }}" target="_blank">{{ branch[0] }}</a></td>

            <!-- 전화번호 -->
            <td>{{ branch[1] }}</td>

            <!-- 채팅 주소 -->
            <td><a href="{{ branch[2] }}" target="_blank">{{ branch[2] }}</a></td>

            <!-- 접속 코드 -->
            <td>{{ branch[3] }}</td>

            <!-- QR 코드 -->
            <td>
                {% set qr_url = request.url_root ~ 'b/' ~ branch[3] %}
                <a href="{{ qr_url }}" target="_blank">
                    <img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data={{ qr_url | urlencode }}" alt="QR Code">
                </a>
                <br>
                <a class="download-link"
                   href="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data={{ qr_url | urlencode }}"
                   download="QR_{{ branch[3] }}.png">
                   ⬇️ 다운로드
                </a>
            </td>

            <!-- 관리 -->
            <td class="actions">
                <form method="POST" action="{{ url_for('delete_branch', slug=branch[3]) }}">
                    <button type="submit">🗑️ 삭제</button>
                </form>
                <a href="{{ url_for('edit_branch', slug=branch[3]) }}">✏️ 수정</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
