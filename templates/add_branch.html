<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>지점 관리</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            background-color: #f9f9f9;
        }

        h2, h3 {
            text-align: center;
        }

        /* 지점 추가 폼 */
        form {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        input, button {
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        input {
            width: 200px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        /* 테이블 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: center;
        }

        img {
            width: 80px;
        }

        a {
            text-decoration: none;
            color: #0066cc;
        }

        a:hover {
            text-decoration: underline;
        }

        hr {
            margin: 40px 0;
        }
    </style>
</head>
<body>
    <h2>📌 지점 추가</h2>
    <form method="POST">
        <input type="text" name="name" placeholder="지점명" required>
        <input type="text" name="phone" placeholder="전화번호" required>
        <input type="text" name="chat_url" placeholder="채팅 URL" required>
        <input type="text" name="slug" placeholder="접속 코드 (예: gangnam)" required>
        <button type="submit">➕ 추가</button>
    </form>

    <hr>

    <h3>📋 지점 목록</h3>
    <table>
        <tr>
            <th>지점명</th>
            <th>전화번호</th>
            <th>채팅 URL</th>
            <th>접속 코드</th>
            <th>QR 코드</th>
            <th>수정</th>
            <th>삭제</th>
        </tr>
        {% for branch in branches %}
        <tr>
            <td>
                <a href="{{ url_for('branch_page', slug=branch[3]) }}" target="_blank">
                    {{ branch[0] }}
                </a>
            </td>
            <td>{{ branch[1] }}</td>
            <td><a href="{{ branch[2] }}" target="_blank">채팅 열기</a></td>
            <td>{{ branch[3] }}</td>
            <td>
                <a href="{{ url_for('generate_qr', slug=branch[3]) }}" download>
                    <img src="{{ url_for('generate_qr', slug=branch[3]) }}" alt="QR 코드">
                </a>
            </td>
            <td>
                <a href="{{ url_for('edit_branch', slug=branch[3]) }}">✏️ 수정</a>
            </td>
            <td>
                <form method="POST" action="{{ url_for('delete_branch', slug=branch[3]) }}">
                    <button type="submit" onclick="return confirm('정말 삭제할까요?')">🗑️ 삭제</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
