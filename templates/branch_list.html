<!DOCTYPE html>
<html>
<head>
    <title>지점 목록</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #999;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #eee;
        }
    </style>
</head>
<body>
    <h2 style="text-align:center;">📋 등록된 지점 목록</h2>
    <table>
        <tr>
            <th>ID</th>
            <th>지점명</th>
            <th>전화번호</th>
            <th>채팅 URL</th>
            <th>슬러그</th>
            <th>QR 접속 링크</th>
        </tr>
        {% for branch in branches %}
        <tr>
            <td>{{ branch['id'] }}</td>
            <td>{{ branch['name'] }}</td>
            <td>{{ branch['phone'] }}</td>
            <td><a href="{{ branch['chat_url'] }}" target="_blank">링크</a></td>
            <td>{{ branch['slug'] }}</td>
            <td><a href="{{ url_for('branch_page', slug=branch['slug']) }}" target="_blank">/b/{{ branch['slug'] }}</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
