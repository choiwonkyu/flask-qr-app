<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>지점 수정</title>
</head>
<body>
    <h1>지점 수정</h1>
    <form method="POST">
        <p><input type="password" name="password" placeholder="관리자 비밀번호" required></p>
        <p><input type="text" name="name" value="{{ branch[1] }}" required></p>
        <p><input type="text" name="phone" value="{{ branch[2] }}" required></p>
        <p><input type="text" name="chat_url" value="{{ branch[3] }}" required></p>
        <p><button type="submit">수정 완료</button></p>
    </form>
    <p><a href="/admin/add">← 돌아가기</a></p>
</body>
</html>
