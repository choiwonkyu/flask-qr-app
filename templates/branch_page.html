<!DOCTYPE html>
<html>
<head>
    <title>{{ branch.name }} 지점 페이지</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 100px 20px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 40px;
        }
        .btn {
            display: inline-block;
            width: 200px;
            padding: 20px;
            margin: 20px;
            font-size: 20px;
            background-color: #2196F3;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>{{ branch.name }} 지점</h1>
    <a href="tel:{{ branch.phone }}" class="btn">업무폰 연결</a>
    <a href="#" class="btn">상담 채팅</a>
</body>
</html>
