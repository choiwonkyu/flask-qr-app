<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ name }} 지점 안내</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 40px;
        }
        .btn {
            display: inline-block;
            width: 200px;
            padding: 20px;
            margin: 20px;
            font-size: 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }
        .call-btn {
            background-color: #007bff;
        }
        .chat-btn {
            background-color: #28a745;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <h1>📍 {{ name }} 지점</h1>

    <a href="tel:{{ phone }}" class="btn call-btn">📞 전화 연결</a>
    <a href="{{ chat_url }}" class="btn chat-btn" target="_blank">💬 채팅 연결</a>
</body>
</html>
